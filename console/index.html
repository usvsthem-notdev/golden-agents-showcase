  // Render the type SCALE from the tokens if present, else a sensible fixed
  // set — either way in the project's own font stack so it's a real specimen.
  function typeSpecimens(fontStack) {
    var sizes = [['1.75rem', 'page heading'], ['1.25rem', 'form title'],
                 ['1rem', 'body / input'], ['0.8125rem', 'helper / caption']];
    return sizes.map(function (s) {
      return '<div class="row"><div class="spec" style="font:' + s[0] + '/1.2 '
        + esc(fontStack) + '">Cats gossip at dawn — 0123</div>'
        + '<div class="lbl">' + s[0] + ' · ' + s[1] + '</div></div>';
    }).join('');
  }

  function scaleHTML(tokens) {
    // px width of the bar = the token's px value, so the scale is visual.
    return '<div class="dz-scale">' + tokens.map(function (t) {
      var px = parseFloat(t.value);
      var w = isNaN(px) ? 8 : Math.max(2, Math.min(px, 260));
      return '<div class="row"><div class="bar" style="width:' + w + 'px"></div>'
        + '<div class="tk">' + esc(t.name) + '  <b>' + esc(t.value) + '</b></div></div>';
    }).join('') + '</div>';
  }

  // Human review surface: the thesis Core Rules as an eyes-on checklist you
  // fill in while looking at the live frame above. Ephemeral by design — it
  // survives the poll (the design window is excluded from re-render) but not
  // a reload; "copy" lifts it into a review comment you can paste or attach.
  // The board's "thesis review →" button is the AI counterpart; this is the
  // one a person does.
  function thesisCheckHTML(d) {
    var rules = d.thesis_rules || [];
    if (!rules.length) return '';
    var rows = rules.map(function (r) {
      var g = 'dzc-' + r.n;
      return '<div class="dzc-row">'
        + '<div class="dzc-rule"><b>Rule ' + r.n + '</b> ' + esc(r.title) + '</div>'
        + '<div class="dzc-verdicts">'
        + ['pass', 'fail', 'n/a'].map(function (v) {
            return '<label class="dzc-v v-' + v.replace('/', '') + '"><input type="radio" name="'
              + g + '" value="' + v + '"> ' + v + '</label>';
          }).join('')
        + '</div>'
        + '<input type="text" class="dzc-note" data-rule="' + r.n
        + '" placeholder="note / file+line (optional)" maxlength="300">'
        + '</div>';
    }).join('');
    return '<h3 class="dz-h">Thesis check <span class="dz-fmeta">— your eyes-on verdict, '
      + 'per rule</span></h3>'
      + '<div class="dzc">' + rows
      + '<div class="dzc-foot"><button type="button" data-act="dzc-copy">copy as review comment</button>'
      + '<span class="dzc-copied" id="dzcCopied"></span></div></div>';
  }

  function copyThesisCheck() {
    var rows = Array.from(document.querySelectorAll('.dzc-row'));
    if (!rows.length) return;
    var lines = ['Thesis conformance — eyes-on review (' + (state ? state.view.name : '') + ')', ''];
    rows.forEach(function (row) {
      var rule = row.querySelector('.dzc-rule').textContent.trim();
      var checked = row.querySelector('input[type=radio]:checked');
      var verdict = checked ? checked.value.toUpperCase() : '—';
      var note = (row.querySelector('.dzc-note') || {}).value || '';
      lines.push('[' + verdict + '] ' + rule + (note ? '  — ' + note : ''));
    });
    var text = lines.join('\n');
    var done = function () {
      var el2 = document.getElementById('dzcCopied');
      if (el2) { el2.textContent = 'copied ✓'; setTimeout(function () { el2.textContent = ''; }, 3000); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else { done(); }
  }

  function loadRouterModels() {
    var apply = function () {
      var plan = document.getElementById('rtPlanner');

      if (!plan || !routerModels) return;

  function runRoute(btn) {

      + 'the thesis, then decomposing — a real model call, ~1 min. Subtasks appear here.</div>';

  function routeResultHTML(d) {

    var subs = (d.subtasks || []).map(function (st, i) {

  // ---- polling ----------------------------------------------------------
  function setLive(ok, text) {

  function renderAll(s) {
    renderRail(s); renderAlerts(s); renderGrid(s); renderStrip(s);
    el('viewTitle').textContent = s.view.kind === 'all'
      ? 'goldthread console' : s.view.name;
    var p = s.view.path || s.hermes_home;
    var shortP = p.length > 46 ? '…' + p.slice(-45) : p;
    el('meta').innerHTML = '<b>' + s.board.total + '</b> in view · <b>'
      + s.board.board_total + '</b> on board<br>'
      + '<span title="' + esc(p) + '">' + esc(shortP) + '</span>';
    refreshOpenWindow();

  function refresh() {
    var requested = currentView();
    var seq = ++reqSeq;
    fetch('/api/state?view=' + encodeURIComponent(requested), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (s) {
        // Stale-response guard #1: if the user switched views while this
        // fetch was in flight, a slow older response must not overwrite the
        // newer view. Responses race; the hash is the source of truth.
        if (requested !== currentView()) return;
        // Stale-response guard #2: a scheduled poll and a post()-forced
        // refresh can both be in flight at once for the SAME view; if the
        // poll (issued first, describing pre-edit state) resolves AFTER the
        // forced refresh (issued second, describing post-edit state), this
        // response is older than what's already on screen even though nothing
        // about the view changed. Only the most-recently-ISSUED request may
        // apply its result — a real incident: a task the user just filed
        // vanished from an open window until the next poll re-added it.
        if (seq !== reqSeq) return;
        state = s; lastOk = Date.now();
        setLive(true, 'live');
        // Re-render only when the content changed: a poll-driven innerHTML
        // rebuild destroys keyboard focus every 5s for no visual gain.
        var key = JSON.stringify([s.views, s.view, s.thesis, s.profiles, s.board, s.ledger, s.health]);
        if (key === lastRenderKey) return;
        var focused = document.activeElement;
        var focusKey = focused && (focused.getAttribute('data-view')
          || focused.getAttribute('data-name') || focused.id) || null;
        lastRenderKey = key;
        renderAll(s);
        if (focusKey) {
          var again = document.querySelector('[data-view="' + focusKey + '"], [data-name="'
            + focusKey + '"], #' + CSS.escape(focusKey));
          if (again) again.focus();
        }
      })
      .catch(function () { setLive(false, 'disconnected — is server.py running?'); });
  }

  // ---- events -----------------------------------------------------------
  function activate(t) {
    var row = t.closest('[data-view]');
    if (row) {
      location.hash = 'v=' + row.getAttribute('data-view');
      return; // hashchange triggers the refresh
    }
    var card = t.closest('[data-win]');
    if (card) return openWindow(card.getAttribute('data-win'), card.getAttribute('data-name'));
    if (t.closest('#strip')) return openWindow('board');
  }
  document.addEventListener('click', function (e) {
    var actBtn = e.target.closest('[data-act]');
    if (actBtn) { e.stopPropagation(); return handleAction(actBtn); }
    activate(e.target);
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'ntAssignee') {
      ensureModels(function () {
        var a = (document.getElementById('ntAssignee') || {}).value;
        refreshModelPicker(a, null);
      });
      refreshModelPicker(e.target.value, null);
      return;
    }
    var sel = e.target.closest('[data-reassign]');
    if (!sel || !sel.value) return;
    post({ action: 'reassign', task_id: sel.getAttribute('data-reassign'), profile: sel.value });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'ntPrompt') {
      e.preventDefault();
      var b = document.querySelector('[data-act="create"]');
      if (b) handleAction(b);
      return;
    }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (!e.target.closest('[data-win], [data-view], #strip')) return;
    e.preventDefault(); activate(e.target);
  });
  el('winClose').addEventListener('click', function () { openWin = null; el('win').close(); });
  el('win').addEventListener('close', function () { openWin = null; });
  window.addEventListener('resize', drawThreads);
  window.addEventListener('hashchange', function () { lastRenderKey = ''; refresh(); });

  refresh();
  setInterval(refresh, POLL_MS);
  setInterval(function () {
    if (lastOk && Date.now() - lastOk > POLL_MS * 3) setLive(false, 'stale');
  }, POLL_MS);
})();
</script>
</body>
</html>
